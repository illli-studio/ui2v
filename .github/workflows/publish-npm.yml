name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match package.json), e.g. 2.0.0"
        required: true
        type: string

jobs:
  publish:
    name: Publish ui2v to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate checkout
        run: |
          test -f package.json || {
            echo "::error::package.json missing after checkout"
            exit 1
          }
          test -f packages/ui2v/package.json || {
            echo "::error::packages/ui2v/package.json missing — expected registry CLI package"
            exit 1
          }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const version = process.env.VERSION;
          const rootPkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const cliPkg = JSON.parse(fs.readFileSync('packages/ui2v/package.json', 'utf8'));
          const failures = [];

          if (rootPkg.name !== '@ui2v/workspace') {
            failures.push(`root package.json: expected @ui2v/workspace, got ${rootPkg.name}`);
          }
          if (cliPkg.name !== 'ui2v') {
            failures.push(`packages/ui2v: expected name ui2v, got ${cliPkg.name}`);
          }
          if (rootPkg.version !== version) {
            failures.push(`root package.json: expected version ${version}, got ${rootPkg.version}`);
          }
          if (cliPkg.version !== version) {
            failures.push(`packages/ui2v: expected version ${version}, got ${cliPkg.version}`);
          }
          if (cliPkg.bin?.ui2v !== 'bin/ui2v.js') {
            failures.push('packages/ui2v: bin.ui2v must be bin/ui2v.js');
          }

          for (const legacy of ['cli', 'core', 'engine', 'producer', 'runtime-core']) {
            if (fs.existsSync(path.join('packages', legacy, 'package.json'))) {
              failures.push(`packages/${legacy} must not exist (legacy @ui2v/* stack removed)`);
            }
          }

          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log(`Release version validation passed: ui2v@${version}`);
          NODE

      - name: Ensure npm version is free
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "ui2v@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::ui2v@${VERSION} already exists on npm — bump version before publishing"
            exit 1
          fi
          LATEST="$(npm view ui2v version 2>/dev/null || true)"
          export LATEST
          if [[ -z "${LATEST}" ]]; then
            echo "First publish: ui2v@${VERSION}"
            exit 0
          fi
          echo "npm latest=${LATEST}, candidate=${VERSION}"
          node -e '
            const latest = process.env.LATEST;
            const next = process.env.VERSION;
            const parse = (v) => v.split(".").map((n) => Number.parseInt(n, 10));
            const [la, lb, lc] = parse(latest);
            const [na, nb, nc] = parse(next);
            const cmp = na - la || nb - lb || nc - lc;
            if (!(cmp > 0)) {
              console.error("Refusing publish: " + next + " must be > npm latest " + latest);
              process.exit(1);
            }
          '

      - name: Run tests
        run: bun run test

      - name: Build package
        run: bun run build

      - name: Publish ui2v
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "ui2v@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::ui2v@${VERSION} appeared on npm before publish step"
            exit 1
          fi
          echo "Publishing ui2v@${VERSION}"
          (cd packages/ui2v && npm publish --access public --provenance)

      - name: Verify npm registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          published=""
          for attempt in {1..12}; do
            if published="$(npm view "ui2v@${VERSION}" version 2>/dev/null)"; then
              break
            fi
            echo "Waiting for ui2v@${VERSION} (${attempt}/12)"
            sleep 10
          done
          echo "ui2v@${published}"
          if [[ "${published}" != "${VERSION}" ]]; then
            echo "::error::Expected ui2v@${VERSION}, got ${published}"
            exit 1
          fi
